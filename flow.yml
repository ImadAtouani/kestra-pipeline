                      "cpu_percent": get_cpu_usage(),
                      "memory_mb": get_memory_mb(),
                      "timestamp": datetime.now().isoformat()
                  })
              except:
                  pass
              return {"status": "error", "message": str(e), "step": "validation"}
      
      dedup_result = json.loads('{{ outputs.dedup.vars.result }}')
      result = main(dedup_result['deduplicated_data'])
