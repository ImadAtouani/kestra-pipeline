id: pipeline_normalisation
namespace: pipeline

description: |
  Pipeline de normalisation de données
  Traite les données depuis différentes sources (CSV, JSON, XML, Excel, Parquet, HTML, API)

inputs:
  - id: source_type
    type: STRING
    defaults: csv
    required: true
    validator: ^(csv|json|xml|excel|parquet|html|api|graphql|sql)$

  - id: source_path
    type: STRING
    defaults: /app/data/sales_2024.csv
    required: true

  - id: method
    type: STRING
    required: false
    validator: ^(GET|POST|PUT|DELETE)$

  - id: headers
    type: STRING
    required: false

  - id: params
    type: STRING
    required: false

  - id: request_data
    type: STRING
    required: false

  - id: query
    type: STRING
    required: false

  - id: variables
    type: STRING
    required: false

tasks:
  - id: ingestion
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: kestra-pipeline:latest
      networkMode: kestra_kestra_network
    script: |
      import sys
      import os
      import json
      from kestra import Kestra
      import csv
      import re
      import time
      import requests
      import pandas as pd
      from datetime import datetime
      from pymongo import MongoClient
      from io import StringIO
      from bs4 import BeautifulSoup
      import sqlalchemy as sa
      
      def read_csv_file(file_path):
          data = []
          with open(file_path, 'r', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  data.append(row)
          return data[0] if data else {}
      
      def read_json_file(file_path):
          with open(file_path, 'r', encoding='utf-8') as f:
              return json.load(f)
      
      def read_xml_file(file_path):
          import xml.etree.ElementTree as ET
          tree = ET.parse(file_path)
          root = tree.getroot()
          data = {}
          for child in root:
              data[child.tag] = child.text
          return data
      
      def read_excel_file(file_path):
          df = pd.read_excel(file_path)
          return df.to_dict('records')[0] if not df.empty else {}
      
      def read_parquet_file(file_path):
          df = pd.read_parquet(file_path)
          return df.to_dict('records')[0] if not df.empty else {}
      
      def read_html_file(file_path):
          with open(file_path, 'r', encoding='utf-8') as f:
              soup = BeautifulSoup(f.read(), 'html.parser')
          data = {}
          titles = soup.find_all(['h1', 'h2', 'h3'])
          if titles:
              data['titles'] = [t.get_text(strip=True) for t in titles[:5]]
          paragraphs = soup.find_all('p')
          if paragraphs:
              data['paragraphs'] = [p.get_text(strip=True) for p in paragraphs[:5]]
          links = soup.find_all('a')
          if links:
              data['links'] = [{'text': l.get_text(strip=True), 'href': l.get('href')} for l in links[:10]]
          tables = soup.find_all('table')
          if tables:
              table_data = []
              for table in tables[:2]:
                  rows = table.find_all('tr')
                  for row in rows:
                      cells = [c.get_text(strip=True) for c in row.find_all(['td', 'th'])]
                      if cells:
                          table_data.append(cells)
              data['tables'] = table_data
          return data
      
      def read_sql_database(connection_string, query):
          engine = sa.create_engine(connection_string)
          with engine.connect() as conn:
              df = pd.read_sql(query, conn)
          return df.to_dict('records')[0] if not df.empty else {}
      
      def fetch_api_rest(url, method='GET', headers=None, params=None, data=None):
          if method.upper() == 'GET':
              response = requests.get(url, headers=headers, params=params)
          elif method.upper() == 'POST':
              response = requests.post(url, headers=headers, json=data)
          elif method.upper() == 'PUT':
              response = requests.put(url, headers=headers, json=data)
          elif method.upper() == 'DELETE':
              response = requests.delete(url, headers=headers)
          else:
              raise ValueError(f"Méthode non supportée: {method}")
          response.raise_for_status()
          return response.json()
      
      def fetch_api_graphql(url, query, variables=None, headers=None):
          payload = {'query': query}
          if variables:
              payload['variables'] = variables
          response = requests.post(url, json=payload, headers=headers)
          response.raise_for_status()
          return response.json()
      
      def detect_format(file_path):
          ext = os.path.splitext(file_path)[1].lower()
          formats = {
              '.csv': 'csv',
              '.json': 'json',
              '.xml': 'xml',
              '.xlsx': 'excel',
              '.xls': 'excel',
              '.parquet': 'parquet',
              '.html': 'html',
              '.htm': 'html'
          }
          return formats.get(ext, 'unknown')
      
      def detect_source_type(source_type, source_path):
          if source_type:
              return source_type
          if source_path.startswith('http://') or source_path.startswith('https://'):
              return 'api'
          if source_path.startswith('postgresql://') or source_path.startswith('mysql://') or source_path.startswith('sqlite://'):
              return 'sql'
          ext = os.path.splitext(source_path)[1].lower()
          if ext in ['.csv']:
              return 'csv'
          if ext in ['.json', '.xml']:
              return 'json'
          if ext in ['.xlsx', '.xls']:
              return 'excel'
          if ext in ['.parquet']:
              return 'parquet'
          if ext in ['.html', '.htm']:
              return 'html'
          return 'unknown'
      
      def read_data_from_source(source_type, source_path, file_path=None, format=None, **kwargs):
          if source_type in ['csv', 'json', 'xml', 'excel', 'parquet', 'html']:
              actual_path = file_path or source_path
              if not os.path.exists(actual_path):
                  raise FileNotFoundError(f"Fichier introuvable: {actual_path}")
              if source_type == 'csv':
                  return read_csv_file(actual_path)
              elif source_type == 'json':
                  return read_json_file(actual_path)
              elif source_type == 'xml':
                  return read_xml_file(actual_path)
              elif source_type == 'excel':
                  return read_excel_file(actual_path)
              elif source_type == 'parquet':
                  return read_parquet_file(actual_path)
              elif source_type == 'html':
                  return read_html_file(actual_path)
          elif source_type == 'api':
              url = source_path
              method = kwargs.get('method', 'GET')
              headers = kwargs.get('headers', {})
              data = kwargs.get('data', {})
              params = kwargs.get('params', {})
              return fetch_api_rest(url, method, headers, params, data)
          elif source_type == 'graphql':
              url = source_path
              query = kwargs.get('query', '')
              variables = kwargs.get('variables', {})
              headers = kwargs.get('headers', {})
              return fetch_api_graphql(url, query, variables, headers)
          elif source_type == 'sql':
              connection_string = source_path
              query = kwargs.get('query', 'SELECT * FROM table LIMIT 1')
              return read_sql_database(connection_string, query)
          else:
              raise ValueError(f"Type de source non supporté: {source_type}")
      
      def get_cpu_usage():
          try:
              with open('/proc/stat', 'r') as f:
                  line = f.readline()
                  parts = line.split()
                  user = int(parts[1])
                  nice = int(parts[2])
                  system = int(parts[3])
                  idle = int(parts[4])
                  total = user + nice + system + idle
                  return round(((total - idle) / total) * 100, 2) if total > 0 else 0
          except:
              return 0
      
      def get_memory_mb():
          try:
              with open('/proc/self/status', 'r') as f:
                  for line in f:
                      if line.startswith('VmRSS:'):
                          kb = int(line.split()[1])
                          return round(kb / 1024, 2)
          except:
              return 0
      
      def main(
          source_type: str = None,
          source_path: str = None,
          file_path: str = None,
          format: str = None,
          method: str = 'GET',
          headers: str = None,
          params: str = None,
          data: str = None,
          query: str = None,
          variables: str = None
      ):
          start_time = time.time()
          script_name = "ingestion"
          
          try:
              actual_source_type = detect_source_type(source_type, source_path)
              print(f"🔍 Type de source détecté: {actual_source_type}")
              
              actual_file_path = file_path
              if actual_file_path is None and actual_source_type in ['csv', 'json', 'xml', 'excel', 'parquet', 'html']:
                  if source_path.startswith('/'):
                      actual_file_path = source_path
                  else:
                      actual_file_path = f"/app/data/{source_path}"
              
              headers_dict = json.loads(headers) if headers else {}
              params_dict = json.loads(params) if params else {}
              data_dict = json.loads(data) if data else {}
              variables_dict = json.loads(variables) if variables else {}
              
              print(f"📁 Source: {source_path}")
              print(f"📄 Type: {actual_source_type}")
              
              raw_data = read_data_from_source(
                  source_type=actual_source_type,
                  source_path=source_path,
                  file_path=actual_file_path,
                  format=format,
                  method=method,
                  headers=headers_dict,
                  params=params_dict,
                  data=data_dict,
                  query=query,
                  variables=variables_dict
              )
              
              print(f"📊 Données lues: {json.dumps(raw_data, indent=2)}")
              
              client = MongoClient("mongodb://admin:changeme@mongodb:27017/")
              db = client["data_pipeline"]
              
              raw_payload = {
                  "source_type": actual_source_type,
                  "source_path": source_path,
                  "ingested_at": datetime.now().isoformat(),
                  "data": raw_data,
                  "file_format": format,
                  "method": method if actual_source_type == 'api' else None
              }
              
              result = db.raw_data.insert_one({
                  "source_type": actual_source_type,
                  "source_path": source_path,
                  "ingested_at": datetime.now().isoformat(),
                  "step": script_name,
                  "raw_payload": raw_payload,
                  "status": "pending"
              })
              
              duration_ms = (time.time() - start_time) * 1000
              db.script_metrics.insert_one({
                  "script": script_name,
                  "duration_ms": duration_ms,
                  "status": "success",
                  "cpu_percent": get_cpu_usage(),
                  "memory_mb": get_memory_mb(),
                  "timestamp": datetime.now().isoformat()
              })
              
              return {
                  "status": "success",
                  "raw_payload": raw_payload,
                  "document_id": str(result.inserted_id),
                  "source_type": actual_source_type,
                  "source_path": source_path,
                  "duration_ms": round(duration_ms, 2),
                  "cpu_percent": get_cpu_usage(),
                  "memory_mb": get_memory_mb(),
                  "step": "ingestion"
              }
              
          except FileNotFoundError as e:
              duration_ms = (time.time() - start_time) * 1000
              try:
                  client = MongoClient("mongodb://admin:changeme@mongodb:27017/")
                  db = client["data_pipeline"]
                  db.script_metrics.insert_one({
                      "script": script_name,
                      "duration_ms": duration_ms,
                      "status": "error",
                      "error": str(e)[:100],
                      "cpu_percent": get_cpu_usage(),
                      "memory_mb": get_memory_mb(),
                      "timestamp": datetime.now().isoformat()
                  })
              except:
                  pass
              return {
                  "status": "error",
                  "message": str(e),
                  "step": "ingestion"
              }
              
          except Exception as e:
              duration_ms = (time.time() - start_time) * 1000
              try:
                  client = MongoClient("mongodb://admin:changeme@mongodb:27017/")
                  db = client["data_pipeline"]
                  db.script_metrics.insert_one({
                      "script": script_name,
                      "duration_ms": duration_ms,
                      "status": "error",
                      "error": str(e)[:100],
                      "cpu_percent": get_cpu_usage(),
                      "memory_mb": get_memory_mb(),
                      "timestamp": datetime.now().isoformat()
                  })
              except:
                  pass
              return {
                  "status": "error",
                  "message": str(e),
                  "step": "ingestion"
              }
      
      result = main(
          source_type="{{ inputs.source_type }}",
          source_path="{{ inputs.source_path }}",
          method="{{ inputs.method | default('GET') }}",
          headers='{{ inputs.headers | default('{}') }}',
          params='{{ inputs.params | default('{}') }}',
          data='{{ inputs.request_data | default('{}') }}',
          query='{{ inputs.query | default('') }}',
          variables='{{ inputs.variables | default('{}') }}'
      )
      
      Kestra.outputs({"result": result})

  - id: profiling
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: kestra-pipeline:latest
      networkMode: kestra_kestra_network
    script: |
      import sys
      import os
      import json
      from kestra import Kestra
      import time
      from datetime import datetime
      from pymongo import MongoClient
      
      def get_cpu_usage():
          try:
              with open('/proc/stat', 'r') as f:
                  line = f.readline()
                  parts = line.split()
                  user = int(parts[1])
                  nice = int(parts[2])
                  system = int(parts[3])
                  idle = int(parts[4])
                  total = user + nice + system + idle
                  return round(((total - idle) / total) * 100, 2) if total > 0 else 0
          except:
              return 0
      
      def get_memory_mb():
          try:
              with open('/proc/self/status', 'r') as f:
                  for line in f:
                      if line.startswith('VmRSS:'):
                          kb = int(line.split()[1])
                          return round(kb / 1024, 2)
          except:
              return 0
      
      def main(raw_data):
          start_time = time.time()
          script_name = "profiling"
          
          try:
              print("=" * 60)
              print("📥 Données reçues dans profiling:")
              print(f"  - Type: {type(raw_data)}")
              
              if isinstance(raw_data, dict):
                  print(f"  - Clés: {list(raw_data.keys())}")
              elif isinstance(raw_data, list):
                  print(f"  - Longueur de la liste: {len(raw_data)}")
                  if len(raw_data) > 0:
                      print(f"  - Premier élément type: {type(raw_data[0])}")
                      if isinstance(raw_data[0], dict):
                          print(f"  - Clés du premier élément: {list(raw_data[0].keys())}")
              print("=" * 60)
              
              if isinstance(raw_data, list):
                  if len(raw_data) > 0 and isinstance(raw_data[0], dict):
                      data = raw_data[0]
                      print(f"📊 Liste de {len(raw_data)} éléments, utilisation du premier")
                  else:
                      data = {"items": raw_data, "count": len(raw_data)}
              elif isinstance(raw_data, dict):
                  data = raw_data
              else:
                  data = {"value": raw_data}
              
              print(f"📊 Données à profiler: {json.dumps(data, indent=2)}")
              print("=" * 60)
              
              if isinstance(data, dict):
                  column_count = len(data)
                  data_types = {k: type(v).__name__ for k, v in data.items()}
                  null_values = {k: v is None for k, v in data.items()}
                  columns = list(data.keys())
              elif isinstance(data, list):
                  column_count = len(data)
                  data_types = {"list_item_type": type(data[0]).__name__ if data else "empty"}
                  null_values = {"list_empty": len(data) == 0}
                  columns = [f"item_{i}" for i in range(min(len(data), 5))]
              else:
                  column_count = 1
                  data_types = {"value_type": type(data).__name__}
                  null_values = {"is_null": data is None}
                  columns = ["value"]
              
              duration_ms = (time.time() - start_time) * 1000
              client = MongoClient("mongodb://admin:changeme@mongodb:27017/")
              db = client["data_pipeline"]
              db.script_metrics.insert_one({
                  "script": script_name,
                  "duration_ms": duration_ms,
                  "status": "success",
                  "cpu_percent": get_cpu_usage(),
                  "memory_mb": get_memory_mb(),
                  "timestamp": datetime.now().isoformat()
              })
              
              return {
                  "status": "success",
                  "profile": {
                      "column_count": column_count,
                      "data_types": data_types,
                      "null_values": null_values,
                      "columns": columns
                  },
                  "duration_ms": round(duration_ms, 2),
                  "cpu_percent": get_cpu_usage(),
                  "memory_mb": get_memory_mb(),
                  "step": "profiling"
              }
              
          except Exception as e:
              duration_ms = (time.time() - start_time) * 1000
              try:
                  client = MongoClient("mongodb://admin:changeme@mongodb:27017/")
                  db = client["data_pipeline"]
                  db.script_metrics.insert_one({
                      "script": script_name,
                      "duration_ms": duration_ms,
                      "status": "error",
                      "error": str(e)[:100],
                      "cpu_percent": get_cpu_usage(),
                      "memory_mb": get_memory_mb(),
                      "timestamp": datetime.now().isoformat()
                  })
              except:
                  pass
              return {"status": "error", "message": str(e), "step": "profiling"}
      
      ingestion_result = json.loads('{{ outputs.ingestion.vars.result }}')
      result = main(ingestion_result['raw_payload']['data'])
      Kestra.outputs({"result": result})

  - id: parsing
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: kestra-pipeline:latest
      networkMode: kestra_kestra_network
    script: |
      import sys
      import os
      import json
      from kestra import Kestra
      import re
      import time
      from typing import Literal, Dict, Any
      from datetime import datetime
      from pymongo import MongoClient
      
      def get_cpu_usage():
          try:
              with open('/proc/stat', 'r') as f:
                  line = f.readline()
                  parts = line.split()
                  user = int(parts[1])
                  nice = int(parts[2])
                  system = int(parts[3])
                  idle = int(parts[4])
                  total = user + nice + system + idle
                  return round(((total - idle) / total) * 100, 2) if total > 0 else 0
          except:
              return 0
      
      def get_memory_mb():
          try:
              with open('/proc/self/status', 'r') as f:
                  for line in f:
                      if line.startswith('VmRSS:'):
                          kb = int(line.split()[1])
                          return round(kb / 1024, 2)
          except:
              return 0
      
      def extract_data_from_html(html_data):
          result = {}
          
          if 'titles' in html_data and html_data['titles']:
              result['name'] = html_data['titles'][0]
          
          if 'tables' in html_data and html_data['tables']:
              table = html_data['tables'][0]
              if len(table) > 1:
                  headers = table[0] if table else []
                  values = table[1] if len(table) > 1 else []
                  
                  for i, header in enumerate(headers):
                      header_lower = header.lower().strip()
                      if i < len(values):
                          value = values[i]
                          if 'id' in header_lower or 'product' in header_lower:
                              result['id'] = value
                          elif 'name' in header_lower:
                              if 'name' not in result:
                                  result['name'] = value
                          elif 'price' in header_lower or 'amount' in header_lower:
                              clean_price = value.replace('$', '').replace('€', '').replace(',', '').strip()
                              result['amount'] = clean_price
                          elif 'date' in header_lower:
                              result['date'] = value
                          elif 'country' in header_lower or 'origin' in header_lower:
                              result['country'] = value
                          elif 'email' in header_lower or 'contact' in header_lower:
                              result['email'] = value
          
          if not result and 'paragraphs' in html_data and html_data['paragraphs']:
              text = ' '.join(html_data['paragraphs'])
              email_match = re.search(r'[\w\.-]+@[\w\.-]+\.\w+', text)
              if email_match:
                  result['email'] = email_match.group()
              price_match = re.search(r'\$?(\d+\.?\d*)', text)
              if price_match:
                  result['amount'] = price_match.group(1)
          
          if 'name' in result and 'id' not in result:
              result['id'] = 'HTML001'
          
          if 'email' in result and 'country' not in result:
              if '@' in result['email']:
                  domain = result['email'].split('@')[1].lower()
                  if 'fr' in domain:
                      result['country'] = 'FR'
                  elif 'de' in domain:
                      result['country'] = 'DE'
                  elif 'uk' in domain or 'co.uk' in domain:
                      result['country'] = 'UK'
                  elif 'ca' in domain:
                      result['country'] = 'CA'
                  else:
                      result['country'] = 'US'
          
          if 'date' not in result:
              result['date'] = datetime.now().strftime('%Y-%m-%d')
          
          if 'email' not in result:
              result['email'] = 'no-email@example.com'
          
          return result
      
      def main(raw_data, format="json"):
          start_time = time.time()
          script_name = "parsing"
          
          try:
              print("=" * 60)
              print("📥 Données reçues dans parsing:")
              print(f"  - format: {format}")
              print(f"  - raw_data type: {type(raw_data)}")
              
              if isinstance(raw_data, dict):
                  print(f"  - raw_data keys: {list(raw_data.keys())}")
              elif isinstance(raw_data, list):
                  print(f"  - raw_data length: {len(raw_data)}")
                  if len(raw_data) > 0:
                      print(f"  - Premier élément type: {type(raw_data[0])}")
              else:
                  print(f"  - raw_data value: {raw_data}")
              print("=" * 60)
              
              if isinstance(raw_data, list):
                  if len(raw_data) == 0:
                      records = {"empty": True, "count": 0}
                  else:
                      records = raw_data[0]
                      print(f"📊 Liste de {len(raw_data)} éléments, utilisation du premier")
              elif isinstance(raw_data, dict):
                  records = raw_data
              else:
                  records = {"value": raw_data}
              
              if format == 'html' or (isinstance(records, dict) and any(k in records for k in ['titles', 'paragraphs', 'tables'])):
                  print("🔄 Détection de données HTML, extraction en cours...")
                  records = extract_data_from_html(records)
                  print(f"📊 Données extraites: {json.dumps(records, indent=2)}")
              
              print(f"📊 Records type: {type(records)}")
              if isinstance(records, dict):
                  print(f"📊 Records keys: {list(records.keys())}")
              print("=" * 60)
              
              parsed_data = {
                  "format": format,
                  "records": records,
                  "record_count": len(records) if isinstance(records, (dict, list)) else 1
              }
              
              duration_ms = (time.time() - start_time) * 1000
              client = MongoClient("mongodb://admin:changeme@mongodb:27017/")
              db = client["data_pipeline"]
              db.script_metrics.insert_one({
                  "script": script_name,
                  "duration_ms": duration_ms,
                  "status": "success",
                  "cpu_percent": get_cpu_usage(),
                  "memory_mb": get_memory_mb(),
                  "timestamp": datetime.now().isoformat()
              })
              
              return {
                  "status": "success",
                  "parsed_data": parsed_data,
                  "duration_ms": round(duration_ms, 2),
                  "cpu_percent": get_cpu_usage(),
                  "memory_mb": get_memory_mb(),
                  "step": "parsing"
              }
              
          except Exception as e:
              duration_ms = (time.time() - start_time) * 1000
              try:
                  client = MongoClient("mongodb://admin:changeme@mongodb:27017/")
                  db = client["data_pipeline"]
                  db.script_metrics.insert_one({
                      "script": script_name,
                      "duration_ms": duration_ms,
                      "status": "error",
                      "error": str(e)[:100],
                      "cpu_percent": get_cpu_usage(),
                      "memory_mb": get_memory_mb(),
                      "timestamp": datetime.now().isoformat()
                  })
              except:
                  pass
              return {"status": "error", "message": str(e), "step": "parsing"}
      
      ingestion_result = json.loads('{{ outputs.ingestion.vars.result }}')
      result = main(ingestion_result['raw_payload']['data'], format="{{ inputs.source_type }}")
      Kestra.outputs({"result": result})

